name: 学生助理考勤

on:
  schedule:
    # 此处未设置 timezone，cron 使用 UTC；北京时间要减 8 小时。
    # 每 15 分钟提供一次初次启动/故障恢复机会，避开整点的调度高峰。
    # 日间正常接力由 workflow_relay.py 主动创建下一轮，不依赖下一次 cron。
    # schedule 仍可能延迟或丢弃，不能保证准点启动或始终有进程在线。
    - cron: '7,22,37,52 * * * *'
  # 允许在 Actions 页面手动触发，方便测试
  workflow_dispatch:

concurrency:
  # 同一时刻只允许一个考勤进程；后续运行等待，不取消守着签退边界的进程。
  # 默认仅保留一个 pending，新的定时运行会替换旧 pending，避免积压。
  # --finish-window 在完成一段班次并确认签退后退出，让等待中的运行接手。
  # 运行器失联时必须等 GitHub 判定失败或超时释放并发锁，无法在代码里保证恢复。
  group: dgut-attendance
  cancel-in-progress: false

jobs:
  attendance:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    # 单个 job 硬上限是 360 分钟。程序软上限 --max-hours 5.5（330 分钟），
    # 到点后最多再延长到硬上限 --hard-max-hours 5.8（348 分钟）把签退做完，
    # 所以这里留到 358。
    timeout-minutes: 358
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Unit tests
        # 离线测试，只验证对账逻辑。即使失败也不许拦住打卡 —— 考勤才是主线。
        continue-on-error: true
        run: python -m unittest discover -s tests -v

      - name: Queue next attendance run
        id: relay
        # GitHub API 失败也要继续本轮考勤；结束后单独把接力失败标红。
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: python workflow_relay.py

      - name: Attendance
        env:
          DGUT_USERNAME: ${{ secrets.USERNAME }}
          DGUT_PASSWORD: ${{ secrets.PASSWORD }}
          SERVER_KEY: ${{ secrets.SERVER_KEY }}
          PYTHONUNBUFFERED: '1'
        run: |
          python attendance.py \
            -U "$DGUT_USERNAME" \
            -P "$DGUT_PASSWORD" \
            -K "$SERVER_KEY" \
            --finish-window \
            --retry-interval 30 \
            --cleanup-seconds 600 \
            --max-hours 5.5 \
            --hard-max-hours 5.8

      - name: Report relay failure
        if: ${{ !cancelled() && steps.relay.outcome == 'failure' }}
        run: |
          echo '接力任务未能创建；本轮考勤已执行，请检查 Queue next attendance run 日志。'
          exit 1
