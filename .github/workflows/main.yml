name: 学生助理考勤

on:
  schedule:
    # 注意：GitHub Actions 的 cron 一律使用 UTC，北京时间要减 8 小时。
    #
    # 为什么要开三个而不是两个：实测这个仓库的 schedule 事件被排队得很厉害
    # （2026-09-25 ~ 09-29 的记录）：目标 07:30 的实际上 09:40~10:40 才跑，
    # 目标 13:30 的更是拖到 18:00~19:53 才跑。原来只有两次，13:30 那次等于
    # 完全错过 14:30-16:10 这个时段，只能靠上午那次硬撑到 16:10，一旦它先到
    # 运行时长上限退出，会话就一直挂着，工时白涨好几个小时。
    # 现在每个考勤时段都各有一个「主攻」和一个「备份」，覆盖更稳。
    - cron: '0 22 * * *'    # 06:00 北京 → 覆盖上午 08:30-12:00
    - cron: '30 23 * * *'   # 07:30 北京 → 上午的备份
    - cron: '0 4 * * *'     # 12:00 北京 → 覆盖下午 14:30-17:00
    - cron: '30 9 * * *'    # 17:30 北京 → 覆盖傍晚 18:00-21:00 / 给下午时段收尾
  # 允许在 Actions 页面手动触发，方便测试
  workflow_dispatch:

jobs:
  attendance:
    runs-on: ubuntu-latest
    # 单个 job 硬上限是 360 分钟；程序本身 --max-hours 5.5(330min)，
    # 到点后最多再延长 20 分钟把签退做完，所以这里留到 358。
    timeout-minutes: 358
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Attendance
        run: |
          python attendance.py \
            -U "${{ secrets.USERNAME }}" \
            -P "${{ secrets.PASSWORD }}" \
            -K "${{ secrets.SERVER_KEY }}" \
            --max-hours 5.5
